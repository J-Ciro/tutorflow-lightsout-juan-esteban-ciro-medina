$kind: http-request
order: 4000
method: POST
url: '{{baseUrl}}/api/asistente/preguntar'
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "pregunta": "¿Cuál es el promedio de EST-004?",
      "usuario": {
        "rol": "coordinador",
        "id": "COORD-01"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("ESC-058 responde 403 sin pasar por el LLM", () => pm.response.to.have.status(403));
      pm.test("ESC-058 responde en menos de 500 ms", () => pm.expect(pm.response.responseTime).to.be.below(500));
