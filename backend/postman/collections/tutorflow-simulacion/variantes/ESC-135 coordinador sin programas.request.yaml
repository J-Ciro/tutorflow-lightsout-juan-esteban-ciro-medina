$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/api/asistente/preguntar'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "pregunta": "¿Qué estudiantes de mi programa perdieron materias?",
      "usuario": {
        "rol": "coordinador",
        "id": "COORD-03"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("ESC-135 responde 200", () => pm.response.to.have.status(200));
      pm.test("ESC-135 forma exacta de la salida", () => {
        const cuerpo = pm.response.json();
        pm.expect(Object.keys(cuerpo).sort()).to.eql(["citas", "costoUsd", "respuesta", "tokens", "usoDatosEstudiante"]);
      });
      pm.test("ESC-135 sin datos de estudiantes y usoDatosEstudiante false", () => pm.expect(pm.response.json().usoDatosEstudiante).to.eql(false));
      pm.test("ESC-135 la respuesta no contiene datos de estudiantes", () => {
        const texto = pm.response.text();
        ["Laura Gómez","Andrés Martínez","Sofía Herrera","EST-001","EST-002","EST-003","Camilo Rojas","Valentina Castro","Mateo Vargas","EST-004","EST-005","EST-006"].forEach((p) => pm.expect(texto).to.not.include(p));
      });
