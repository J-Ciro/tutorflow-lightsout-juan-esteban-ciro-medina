$kind: collection
name: 'TutorFlow'
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test("SEG-14 X-Content-Type-Options nosniff", () => pm.expect(pm.response.headers.get("X-Content-Type-Options")).to.eql("nosniff"));
      pm.test("SEG-14 X-Frame-Options DENY", () => pm.expect(pm.response.headers.get("X-Frame-Options")).to.eql("DENY"));
      pm.test("SEG-14 Referrer-Policy no-referrer", () => pm.expect(pm.response.headers.get("Referrer-Policy")).to.eql("no-referrer"));
      pm.test("SEG-14 sin Access-Control-Allow-Origin comodin", () => pm.expect(pm.response.headers.get("Access-Control-Allow-Origin")).to.not.eql("*"));
