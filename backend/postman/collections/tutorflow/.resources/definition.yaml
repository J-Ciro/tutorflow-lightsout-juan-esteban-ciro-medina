$kind: collection
name: 'TutorFlow'
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test("SEG-14 X-Content-Type-Options nosniff", () => pm.expect(pm.response.headers.get("X-Content-Type-Options")).to.eql("nosniff"));
      pm.test("SEG-14 X-Frame-Options DENY", () => pm.expect(pm.response.headers.get("X-Frame-Options")).to.eql("DENY"));
      pm.test("SEG-14 Referrer-Policy no-referrer", () => pm.expect(pm.response.headers.get("Referrer-Policy")).to.eql("no-referrer"));
      pm.test("SEG-14 sin Access-Control-Allow-Origin comodin", () => pm.expect(pm.response.headers.get("Access-Control-Allow-Origin")).to.not.eql("*"));
      const UUID_V7 = /^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;
      const correlacion = pm.response.headers.get("X-Correlation-Id");
      pm.test("D-26 X-Correlation-Id es un UUID v7 en minúsculas", () => pm.expect(correlacion).to.match(UUID_V7));
      pm.test("D-26 X-Correlation-Id no se repite entre respuestas", () => {
        const vistos = JSON.parse(pm.collectionVariables.get("correlacionesVistas") || "[]");
        pm.expect(vistos).to.not.include(correlacion);
        pm.collectionVariables.set("correlacionesVistas", JSON.stringify(vistos.concat(correlacion)));
      });
      pm.test("D-26 traceId del ProblemDetails es igual al X-Correlation-Id", () => {
        if ((pm.response.headers.get("Content-Type") || "").includes("application/problem+json")) {
          pm.expect(pm.response.json().traceId).to.eql(correlacion);
        }
      });
