$kind: http-request
order: 10000
method: GET
url: '{{baseUrl}}/api/asistente/preguntar'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("ESC-105a responde 405", () => pm.response.to.have.status(405));
      pm.test("ESC-105a cuerpo vacío o ProblemDetails", () => {
        const texto = pm.response.text();
        if (texto.length > 0) {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
        }
      });
