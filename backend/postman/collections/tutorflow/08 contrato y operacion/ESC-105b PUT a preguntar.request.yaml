$kind: http-request
order: 11000
method: PUT
url: '{{baseUrl}}/api/asistente/preguntar'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("ESC-105b responde 405", () => pm.response.to.have.status(405));
      pm.test("ESC-105b cuerpo vacío o ProblemDetails", () => {
        const texto = pm.response.text();
        if (texto.length > 0) {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
        }
      });
