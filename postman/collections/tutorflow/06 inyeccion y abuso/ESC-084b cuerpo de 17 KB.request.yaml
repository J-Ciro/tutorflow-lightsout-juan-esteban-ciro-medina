$kind: http-request
order: 10000
method: POST
url: '{{baseUrl}}/api/asistente/preguntar'
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {{cuerpoGrande}}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.variables.set("cuerpoGrande", JSON.stringify({ pregunta: "hola", usuario: { rol: "estudiante", id: "EST-001" }, relleno: "x".repeat(17 * 1024) }));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("ESC-084b responde 413", () => pm.response.to.have.status(413));
      pm.test("ESC-084b es un ProblemDetails (RFC 9457)", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
        const cuerpo = pm.response.json();
        pm.expect(cuerpo.status).to.eql(413);
        pm.expect(cuerpo.title).to.be.a("string");
      });
      pm.test("ESC-084b sin detalles internos ni stack trace", () => {
        const texto = pm.response.text();
        ["StackTrace", "   at ", "Exception", "System.", "Microsoft.", "TutorFlow.", "localhost:4000", ".cs:line"].forEach((f) => pm.expect(texto).to.not.include(f));
      });
      pm.test("ESC-084b no es una salida del contrato del asistente", () => {
        pm.expect(pm.response.json()).to.not.have.property("respuesta");
      });
