$kind: http-request
order: 13000
method: POST
url: '{{baseUrl}}/api/salud'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("ESC-105d responde 405", () => pm.response.to.have.status(405));
      pm.test("ESC-105d cuerpo vacío o ProblemDetails", () => {
        const texto = pm.response.text();
        if (texto.length > 0) {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
        }
      });
